<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>玉石浮雕卡牌馆</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(1200px 600px at 50% -100px,#1c1610 0%,#0d0b08 60%);color:#e8dcc0;font-family:"Songti SC","STSong","SimSun",serif;max-width:1100px;margin:0 auto;padding:0 14px 70px;min-height:100vh}
/* ---------- header ---------- */
header{text-align:center;padding:52px 10px 22px}
header .kicker{font-size:11px;letter-spacing:6px;color:#8a7a58;margin-bottom:14px}
header h1{font-size:34px;letter-spacing:12px;color:#d4af37;font-weight:600;text-shadow:0 0 26px rgba(212,175,55,.35);text-indent:12px}
header .en{margin-top:12px;font-size:11px;letter-spacing:5px;color:#8a7a58;font-family:Georgia,serif}
header .rule{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:18px;color:#6b5426}
header .rule::before,header .rule::after{content:"";height:1px;width:120px;background:linear-gradient(90deg,transparent,#6b5426)}
header .rule::after{background:linear-gradient(90deg,#6b5426,transparent)}
header .rule span{font-size:14px}
/* ---------- toolbar ---------- */
.toolbar{position:sticky;top:0;z-index:20;background:rgba(13,11,8,.94);backdrop-filter:blur(8px);padding:10px 0;border-bottom:1px solid #3a2f1c}
.toolbar .row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.toolbar .row:last-child{margin-bottom:0}
.btn{color:#d4af37;background:transparent;border:1px solid #6b5426;border-radius:20px;font-size:13px;letter-spacing:2px;padding:7px 16px;font-family:inherit;cursor:pointer}
.btn.on{background:#2a2113}
.navlink{color:#d4af37;text-decoration:none;font-size:14px;letter-spacing:6px;padding:7px 20px;border:1px solid #6b5426;border-radius:20px;text-indent:6px}
/* ---------- sections ---------- */
.cat{margin-top:52px;scroll-margin-top:120px}
.cat-head{text-align:center;margin-bottom:8px}
.cat-head h2{font-size:24px;letter-spacing:16px;color:#d4af37;text-indent:16px;text-shadow:0 0 18px rgba(212,175,55,.3)}
.cat-head .divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 6px;color:#6b5426;font-size:12px}
.cat-head .divider::before,.cat-head .divider::after{content:"";height:1px;width:90px;background:linear-gradient(90deg,transparent,#6b5426)}
.cat-head .divider::after{background:linear-gradient(90deg,#6b5426,transparent)}
.cat-head .sub{color:#9a8a68;font-size:12px;letter-spacing:3px;margin-bottom:24px}
.theme{margin-bottom:40px}
.theme>h3{font-size:17px;letter-spacing:5px;color:#f0e6cc;border-left:3px solid #d4af37;padding-left:12px;margin-bottom:16px;font-weight:600}
.theme>h3 small{font-size:11px;color:#9a8a68;letter-spacing:2px;margin-left:8px;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(5,1fr)}}
/* ---------- 3D card ---------- */
.deal{position:relative;animation:deal .7s cubic-bezier(.2,.8,.3,1.1) backwards}
@keyframes deal{from{opacity:0;transform:translateY(60px) scale(.85)}to{opacity:1;transform:none}}
.floaty{animation:hover 5s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tilt{perspective:900px;cursor:pointer;transition:transform .25s ease;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.flip{position:relative;aspect-ratio:3/4.4;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.3,1.2)}
.deal.flipped .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:10px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 10px 30px rgba(0,0,0,.55),0 0 0 1px #3a2f1c}
.face img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.face.front{transform:rotateY(180deg)}
.face.back{background:#000}
.face.front::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,240,200,.28),rgba(255,240,200,0) 55%);opacity:var(--sh,0);transition:opacity .3s}
.deal.flipped .face.front::after{--sh:1}
.sheen{position:absolute;inset:-40%;pointer-events:none;transform:rotate(18deg);background:linear-gradient(100deg,transparent 42%,rgba(255,244,214,.16) 50%,transparent 58%);animation:sheen 6s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-70%) rotate(18deg)}90%,100%{transform:translateX(70%) rotate(18deg)}}
.expand{position:absolute;top:8px;right:8px;z-index:5;width:30px;height:30px;border-radius:50%;border:1px solid #d4af37;background:rgba(10,8,5,.72);color:#d4af37;font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cap{text-align:center;padding:10px 4px 0}
.cap .t{font-size:15px;font-weight:600;letter-spacing:2px;color:#f0e6cc}
.cap .r{font-size:13px;margin-top:5px;letter-spacing:3px;color:#9a8a68}
.cap .r .s-bk{color:#d4af37}
.cap .r .s-rd{color:#e0645a}
.hint{text-align:center;color:#6b5f45;font-size:12px;letter-spacing:2px;margin:26px 0 6px;line-height:2}
footer{text-align:center;margin-top:50px;color:#6b5f45;font-size:12px;letter-spacing:3px;line-height:2}
/* ---------- fullscreen viewer ---------- */
#viewer{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(5,4,2,.94);backdrop-filter:blur(10px)}
#viewer.show{display:flex}
.v-stage{perspective:1100px;text-align:center;max-height:100vh;overflow-y:auto;padding:20px 0}
.v-tilt{transition:transform .25s ease;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.v-flip{position:relative;width:min(78vw,330px);aspect-ratio:3/4.4;margin:0 auto;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.3,1.2);cursor:pointer}
#viewer.flipped .v-flip{transform:rotateY(180deg)}
.v-cap{margin-top:18px}
.v-cap .t{font-size:20px;font-weight:600;letter-spacing:4px;color:#f0e6cc}
.v-cap .r{font-size:14px;letter-spacing:4px;color:#9a8a68;margin-top:8px}
.v-cap .r .s-bk{color:#d4af37}
.v-cap .r .s-rd{color:#e0645a}
.v-cap .i{font-size:11px;letter-spacing:3px;color:#6b5f45;margin-top:8px;font-family:Georgia,serif}
.v-btn{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid #6b5426;background:rgba(20,16,10,.8);color:#d4af37;font-size:22px;cursor:pointer;z-index:2}
#vPrev{left:12px}
#vNext{right:12px}
#vClose{position:absolute;top:16px;right:16px;width:42px;height:42px;border-radius:50%;border:1px solid #6b5426;background:rgba(20,16,10,.8);color:#d4af37;font-size:20px;cursor:pointer;z-index:2}
.v-hint{position:absolute;bottom:18px;width:100%;text-align:center;color:#6b5f45;font-size:11px;letter-spacing:2px}
</style>
</head>
<body>
<header>
<div class="kicker">3D 玉石浮雕 · 扑克牌艺术</div>
<h1>玉石浮雕卡牌馆</h1>
<div class="en">JADE RELIEF PLAYING CARDS</div>
<div class="rule"><span>❖</span></div>
</header>
<div class="toolbar">
<div class="row"><a class="navlink" href="#mingzhu">名著</a><a class="navlink" href="#manhua">漫画</a><a class="navlink" href="#youxi">游戏</a></div>
<div class="row"><button class="btn" id="flipAll">全部翻面</button><button class="btn" id="shuffle">洗牌</button></div>
</div>
<div class="hint">点牌翻面 · 点右上角 ⤢ 全屏看牌<br>← → 切换 · ESC 关闭</div>
<div id="app"></div>
<footer>玉石浮雕卡牌馆 · 2026<br>JADE RELIEF PLAYING CARDS</footer>

<div id="viewer">
<button id="vClose">×</button>
<button class="v-btn" id="vPrev">‹</button>
<div class="v-stage">
<div class="v-tilt"><div class="v-flip" id="vFlip">
<div class="face back"><img id="vBack" alt="卡背"></div>
<div class="face front"><img id="vFront" alt="卡面"><div class="sheen"></div></div>
</div></div>
<div class="v-cap"><div class="t" id="vT"></div><div class="r" id="vR"></div><div class="i" id="vI"></div></div>
</div>
<button class="v-btn" id="vNext">›</button>
<div class="v-hint">点卡片翻面 · ← → 切换 · ESC 关闭</div>
</div>

<script>
var BACK="img/card-back-v3.webp";
var DATA=[
{cat:"名著",id:"mingzhu",themes:[
{t:"西游记",cards:[["xiyou-1-danaotiangong","大闹天宫","黑桃 K"],["xiyou-3-huoyanshan","火焰山借扇","方块 J"],["xiyou-4-shituxixing","师徒西行","梅花 10"],["xiyou-5-zhanerlangshen","大战二郎神","红桃 A"],["xiyou-5-renshenguo","人参果","红桃 Q"]]},
{t:"三国演义",cards:[["sanguo-1-taoyuansanjieyi","桃园三结义","黑桃 A"],["sanguo-2-guanyuguowuguan","关羽过五关","红桃 K"],["sanguo-3-caochuanjiejian","草船借箭","方块 Q"],["sanguo-4-changbanpo","长坂坡","梅花 J"],["sanguo-5-chibi","赤壁之战","红桃 10"]]},
{t:"水浒传",cards:[["shuihu-1-wusongdahu","武松打虎","梅花 A"],["shuihu-2-luzhishen","倒拔垂杨柳","方块 K"],["shuihu-3-songjiang","浔阳楼题诗","黑桃 Q"],["shuihu-4-dajuyi","梁山大聚义","黑桃 10"],["shuihu-5-zhiqu","智取生辰纲","红桃 J"]]},
{t:"红楼梦",cards:[["honglou-1-daiyuzanghua","黛玉葬花","红桃 A"],["honglou-2-baoyu","贾宝玉","方块 K"],["honglou-3-wangxifeng","王熙凤","梅花 Q"],["honglou-4-liulaolao","刘姥姥进大观园","黑桃 J"],["honglou-5-yuanchun","元春省亲","方块 10"]]},
{t:"聊斋志异",cards:[["liaozhai-1-niexiaoqian","聂小倩","黑桃 A"],["liaozhai-2-huapi","画皮","红桃 K"],["liaozhai-3-laoshan","崂山道士","方块 Q"],["liaozhai-4-cuzhi","促织","梅花 J"],["liaozhai-5-yingning","婴宁","红桃 10"]]}
]},
{cat:"漫画",id:"manhua",themes:[
{t:"龙珠",cards:[["longzhu-1-wukong","孙悟空","红桃 K"],["longzhu-2-beijita","贝吉塔","黑桃 A"],["longzhu-3-fulisa","弗利萨","方块 Q"],["longzhu-4-wufan","孙悟饭","梅花 J"],["longzhu-5-shenlong","神龙","红桃 10"]]},
{t:"海贼王",cards:[["haizei-1-lufei","路飞","梅花 Q"],["haizei-2-suolong","索隆","黑桃 K"],["haizei-3-shenping","甚平","红桃 A"],["haizei-4-hongfa","红发香克斯","方块 J"],["haizei-5-qiaoba","乔巴","梅花 10"]]},
{t:"火影忍者",cards:[["huoying-1-mingren","漩涡鸣人","黑桃 A"],["huoying-2-zilaiye","自来也","红桃 K"],["huoying-3-kakaxi","卡卡西","梅花 Q"],["huoying-4-yuzhiboban","宇智波鼬","方块 J"],["huoying-5-peien","佩恩","黑桃 10"]]},
{t:"鬼灭之刃",cards:[["guimie-1-tanzhilang","炭治郎","方块 J"],["guimie-2-nidouzi","祢豆子","红桃 A"],["guimie-3-shanyi","善逸","黑桃 K"],["guimie-4-yizhizhu","伊之助","梅花 Q"],["guimie-5-yiwozuo","猗窝座","方块 10"]]},
{t:"哆啦A梦",cards:[["duola-1-duolaameng","哆啦A梦","梅花 A"],["duola-2-daxiong","大雄","方块 K"],["duola-3-jingxiang","静香","红桃 Q"],["duola-4-panghu","胖虎","黑桃 J"],["duola-5-xiaofu","小夫","方块 10"]]}
]},
{cat:"游戏",id:"youxi",themes:[
{t:"黑神话：悟空",cards:[["heishenhua-1-tianmingren","天命人","黑桃 K"],["heishenhua-2-erlangshen","二郎神","红桃 A"],["heishenhua-3-zhizhujing","蜘蛛精四妹","方块 Q"],["heishenhua-4-huangmei","黄眉老佛","梅花 J"],["heishenhua-5-jinchi","金池长老","红桃 10"]]},
{t:"艾尔登法环",cards:[["eldenring-1-malianniya","玛莲妮亚","黑桃 A"],["eldenring-2-lataen","拉塔恩","红桃 K"],["eldenring-3-lani","菈妮","方块 Q"],["eldenring-4-huangjinshu","黄金树","梅花 J"],["eldenring-5-shou","艾尔登之兽","黑桃 10"]]},
{t:"塞尔达传说",cards:[["zelda-1-linke","林克","红桃 K"],["zelda-2-saierda","塞尔达公主","黑桃 Q"],["zelda-3-mifa","米法","方块 J"],["zelda-4-dashijian","大师剑","梅花 A"],["zelda-5-chengbao","海拉鲁城堡","红桃 10"]]},
{t:"原神",cards:[["yuanshen-1-zhongli","钟离","方块 A"],["yuanshen-2-leidian","雷电将军","梅花 K"],["yuanshen-3-wendi","温迪","红桃 Q"],["yuanshen-4-naxida","纳西妲","黑桃 J"],["yuanshen-5-lvxingzhe","旅行者","方块 10"]]},
{t:"宝可梦",cards:[["baokemeng-1-pikaqiu","皮卡丘","红桃 A"],["baokemeng-2-penhuolong","喷火龙","黑桃 K"],["baokemeng-3-chaomeng","超梦","方块 Q"],["baokemeng-4-liekongzuo","裂空座","梅花 J"],["baokemeng-5-yibu","伊布","红桃 10"]]}
]}
];
function rankHTML(rank){
  return rank.replace("黑桃",'<span class="s-bk">♠</span>')
             .replace("红桃",'<span class="s-rd">♥</span>')
             .replace("梅花",'<span class="s-bk">♣</span>')
             .replace("方块",'<span class="s-rd">♦</span>');
}
var CARDS=[];
var app=document.getElementById('app');
var n=0;
function cardHTML(f,name,rank){
  var idx=CARDS.length;
  CARDS.push({f:f,name:name,rank:rank});
  n++;
  return '<div class="deal" style="animation-delay:'+Math.min(n*18,1400)+'ms">'
  +'<button class="expand" data-i="'+idx+'" title="全屏看牌">⤢</button>'
  +'<div class="floaty" style="animation-delay:'+((n%7)*0.4)+'s">'
  +'<div class="tilt"><div class="flip">'
  +'<div class="face back"><img loading="lazy" src="'+BACK+'" alt="卡背"></div>'
  +'<div class="face front"><img loading="lazy" src="img/'+f+'.webp" alt="'+name+'"><div class="sheen"></div></div>'
  +'</div></div>'
  +'<div class="cap"><div class="t">'+name+'</div><div class="r">'+rankHTML(rank)+'</div></div>'
  +'</div></div>';
}
function themeHTML(t){
  return '<div class="theme"><h3>'+t.t+'<small>'+t.cards.length+' 张</small></h3><div class="grid">'
  + t.cards.map(function(c){return cardHTML(c[0],c[1],c[2]);}).join('')
  + '</div></div>';
}
app.innerHTML=DATA.map(function(c){
  return '<section class="cat" id="'+c.id+'"><div class="cat-head"><h2>'+c.cat+'</h2>'
  +'<div class="divider">❖</div>'
  +'<div class="sub">'+c.themes.length+' 个主题 · '+(c.themes.length*5)+' 张</div></div>'
  + c.themes.map(themeHTML).join('') + '</section>';
}).join('');

/* ---------- interactions ---------- */
var fine=matchMedia('(hover:hover) and (pointer:fine)').matches;
function bindTilt(scope,el){
  if(!fine) return;
  scope.addEventListener('pointermove',function(e){
    var r=el.getBoundingClientRect();
    var x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    el.style.setProperty('--ry',(x*14)+'deg');
    el.style.setProperty('--rx',(-y*14)+'deg');
    el.style.setProperty('--mx',((x+.5)*100)+'%');
    el.style.setProperty('--my',((y+.5)*100)+'%');
    el.style.setProperty('--sh',1);
  });
  scope.addEventListener('pointerleave',function(){
    el.style.setProperty('--rx','0deg');el.style.setProperty('--ry','0deg');
    el.style.setProperty('--sh',0);
  });
}
var deals=document.querySelectorAll('.deal');
for(var i=0;i<deals.length;i++){
  (function(d){
    var tilt=d.querySelector('.tilt');
    d.addEventListener('click',function(){d.classList.toggle('flipped');});
    bindTilt(d,tilt);
    var ex=d.querySelector('.expand');
    ex.addEventListener('click',function(e){e.stopPropagation();openViewer(parseInt(ex.getAttribute('data-i'),10));});
  })(deals[i]);
}
var flipBtn=document.getElementById('flipAll'), allFlipped=false;
flipBtn.addEventListener('click',function(){
  allFlipped=!allFlipped;
  for(var i=0;i<deals.length;i++) deals[i].classList.toggle('flipped',allFlipped);
  flipBtn.textContent=allFlipped?'全部扣回':'全部翻面';
  flipBtn.classList.toggle('on',allFlipped);
});
document.getElementById('shuffle').addEventListener('click',function(){
  var grids=document.querySelectorAll('.grid');
  for(var g=0;g<grids.length;g++){
    var k=[],ch=grids[g].children;
    for(var i=0;i<ch.length;i++) k.push(ch[i]);
    for(var j=k.length-1;j>0;j--){var r=Math.floor(Math.random()*(j+1));var tmp=k[j];k[j]=k[r];k[r]=tmp;}
    for(var m=0;m<k.length;m++){
      k[m].style.animation='none';void k[m].offsetWidth;k[m].style.animation='';
      k[m].style.animationDelay=(m*60)+'ms';grids[g].appendChild(k[m]);
    }
  }
});
/* ---------- fullscreen viewer ---------- */
var viewer=document.getElementById('viewer'),
    vFlip=document.getElementById('vFlip'),
    vTilt=viewer.querySelector('.v-tilt'),
    vFront=document.getElementById('vFront'),
    vT=document.getElementById('vT'),
    vR=document.getElementById('vR'),
    vI=document.getElementById('vI'),
    vIdx=0, vTimer=null;
document.getElementById('vBack').src=BACK;
function showCard(i){
  vIdx=(i+CARDS.length)%CARDS.length;
  var c=CARDS[vIdx];
  viewer.classList.remove('flipped');
  vFront.src='img/'+c.f+'.webp';
  vFront.alt=c.name;
  vT.textContent=c.name;
  vR.innerHTML=rankHTML(c.rank);
  vI.textContent=(vIdx+1)+' / '+CARDS.length;
  if(vTimer) clearTimeout(vTimer);
  vTimer=setTimeout(function(){viewer.classList.add('flipped');},280);
}
function openViewer(i){
  viewer.classList.add('show');
  document.body.style.overflow='hidden';
  showCard(i);
}
function closeViewer(){
  viewer.classList.remove('show');
  document.body.style.overflow='';
  if(vTimer) clearTimeout(vTimer);
}
document.getElementById('vClose').addEventListener('click',closeViewer);
document.getElementById('vPrev').addEventListener('click',function(e){e.stopPropagation();showCard(vIdx-1);});
document.getElementById('vNext').addEventListener('click',function(e){e.stopPropagation();showCard(vIdx+1);});
vFlip.addEventListener('click',function(){viewer.classList.toggle('flipped');});
viewer.addEventListener('click',function(e){if(e.target===viewer) closeViewer();});
document.addEventListener('keydown',function(e){
  if(!viewer.classList.contains('show')) return;
  if(e.key==='Escape') closeViewer();
  else if(e.key==='ArrowLeft') showCard(vIdx-1);
  else if(e.key==='ArrowRight') showCard(vIdx+1);
});
bindTilt(viewer.querySelector('.v-stage'),vTilt);
</script>
</body>
</html>
